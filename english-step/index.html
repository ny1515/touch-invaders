<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Step</title>
  </head>
  <body>
    <noscript>English Stepを利用するにはJavaScriptを有効にしてください。</noscript>
    <main id="loading" style="font-family: Segoe UI, Hiragino Sans, Yu Gothic, Meiryo, sans-serif; padding: 24px; line-height: 1.8; color: #172033;">English Stepを読み込んでいます。</main>
    <script>
      (async () => {
        const baseUrl = "https://raw.githubusercontent.com/ny1515/touch-invaders/5aec59b020eb7698f283dbf2e2a1476ecb4d3760/english-step/index.html";
        const extraPayloadUrl = "https://raw.githubusercontent.com/ny1515/touch-invaders/19212b713ef30fe71334579afba00d98933bfb7d/english-step/index.html";

        if (!("DecompressionStream" in window)) {
          document.body.innerHTML = "<main style=\"font-family:sans-serif;padding:24px;line-height:1.8\"><h1>English Step</h1><p>このブラウザは圧縮された公開版の読み込みに対応していません。最新のChrome、Edge、Safariで開いてください。</p></main>";
          return;
        }

        async function inflateBase64(payload) {
          const binary = atob(payload);
          const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
          return new Response(stream).text();
        }

        function patchAppSource(appHtml) {
          let patched = appHtml;
          patched = patched.replace(
            'wordCategory: "all",',
            'wordCategory: "all",\n    wordListMode: "all",\n    wordRandomSeed: "initial",'
          );
          patched = patched.replace(
            /function getFilteredWords\(\) \{\s*const words = wordsFor\(\);\s*return state\.wordCategory === "all" \? words : words\.filter\(\(word\) => word\.category === state\.wordCategory\);\s*\}/,
            'function getCategoryWords() {\n    const words = wordsFor();\n    return state.wordCategory === "all" ? words : words.filter((word) => word.category === state.wordCategory);\n  }\n\n  function getFilteredWords() {\n    const words = getCategoryWords();\n    if (state.wordListMode !== "random") return words;\n    return shuffle(words, progress.selectedLevel + ":" + state.wordCategory + ":" + state.wordRandomSeed).slice(0, Math.min(10, words.length));\n  }'
          );
          patched = patched.replace(
            /const words = getFilteredWords\(\);\s*const word = getCurrentWord\(\);\s*const categories = \["all", \.\.\.new Set\(wordsFor\(\)\.map\(\(item\) => item\.category\)\)\];/,
            'const words = getFilteredWords();\n    const word = getCurrentWord();\n    const allWords = wordsFor();\n    const categoryWords = getCategoryWords();\n    const categories = ["all", ...new Set(allWords.map((item) => item.category))];\n    const displayNote = state.wordListMode === "random"\n      ? "全" + categoryWords.length + "語からランダム" + words.length + "語を表示"\n      : state.wordCategory === "all"\n        ? "選択中レベルの全" + allWords.length + "語を表示"\n        : "全" + allWords.length + "語中 " + categoryWords.length + "語を表示";'
          );
          patched = patched.replace(
            '<h2>${words.length}語</h2>',
            '<h2>${words.length}語</h2>\n              <small class="word-count-note">${displayNote}</small>'
          );

          const controlsMarkup = [
            '          <div class="word-list-controls" aria-label="単語の表示方法">',
            '            <button class="${state.wordListMode === "all" ? "active" : ""}" data-action="set-word-list-mode" data-mode="all">全て表示</button>',
            '            <button class="${state.wordListMode === "random" ? "active" : ""}" data-action="set-word-list-mode" data-mode="random">ランダム10語</button>',
            '            <button class="shuffle-button" data-action="shuffle-word-list" ${state.wordListMode === "random" ? "" : "disabled"}>ランダム更新</button>',
            '          </div>'
          ].join("\n");
          patched = patched.replace('          <div class="segmented">', controlsMarkup + '\n          <div class="segmented">');
          patched = patched.replace(
            '    if (action === "select-word") {',
            '    if (action === "set-word-list-mode") {\n      state.wordListMode = button.dataset.mode;\n      state.wordRandomSeed = String(Date.now());\n      state.wordIndex = 0;\n      state.wordFeedback = null;\n      state.wordAnswerVisible = false;\n      state.spellingAnswer = "";\n      render();\n      return;\n    }\n\n    if (action === "shuffle-word-list") {\n      state.wordListMode = "random";\n      state.wordRandomSeed = String(Date.now());\n      state.wordIndex = 0;\n      state.wordFeedback = null;\n      state.wordAnswerVisible = false;\n      state.spellingAnswer = "";\n      render();\n      return;\n    }\n\n    if (action === "select-word") {'
          );
          patched = patched.replace(
            '      state.wordCategory = "all";\n      state.wordAnswerVisible = false;',
            '      state.wordCategory = "all";\n      state.wordListMode = "all";\n      state.wordRandomSeed = String(Date.now());\n      state.wordAnswerVisible = false;'
          );
          patched = patched.replace(
            '      state.wordCategory = control.value;\n      state.wordIndex = 0;\n      state.wordFeedback = null;',
            '      state.wordCategory = control.value;\n      state.wordIndex = 0;\n      state.wordListMode = "all";\n      state.wordRandomSeed = String(Date.now());\n      state.wordFeedback = null;'
          );
          return patched;
        }

        const [source, extraSource] = await Promise.all([
          fetch(baseUrl, { cache: "no-store" }).then((response) => {
            if (!response.ok) throw new Error(`Base app load failed: ${response.status}`);
            return response.text();
          }),
          fetch(extraPayloadUrl, { cache: "no-store" }).then((response) => {
            if (!response.ok) throw new Error(`Extra word payload load failed: ${response.status}`);
            return response.text();
          })
        ]);

        const baseMatch = source.match(/const payload = "([^"]+)"/);
        const extraMatch = extraSource.match(/const extraWordsPayload = "([^"]+)"/);
        if (!baseMatch) throw new Error("Base app payload not found");
        if (!extraMatch) throw new Error("Extra word payload not found");

        let html = await inflateBase64(baseMatch[1]);
        html = patchAppSource(html);
        const extraWordsJson = await inflateBase64(extraMatch[1]);
        const safeExtraWordsJson = extraWordsJson.replaceAll("</scr" + "ipt", "<\\/script");

        const dataPatch = "<scr" + "ipt>\n" + `
            (() => {
              const extraWords = ${safeExtraWordsJson};
              const existingWordIds = new Set(window.ENGLISH_STEP_DATA.words.map((word) => word.id));
              window.ENGLISH_STEP_DATA.words.push(...extraWords.filter((word) => !existingWordIds.has(word.id)));

              function buildGeneratedWordQuiz(word, index) {
                const sameLevelWords = window.ENGLISH_STEP_DATA.words.filter((item) => item.level === word.level && item.id !== word.id);
                const distractors = sameLevelWords.slice(index % sameLevelWords.length).concat(sameLevelWords).slice(0, 3);
                const choices = [word.meaning, ...distractors.map((item) => item.meaning)];
                const offset = index % choices.length;
                return {
                  id: "auto-wq-" + word.id,
                  type: "word",
                  level: word.level,
                  question: word.word + " の意味は？",
                  choices: choices.map((_, choiceIndex) => choices[(choiceIndex + offset) % choices.length]),
                  answer: word.meaning,
                  explanation: word.word + " は「" + word.meaning + "」という意味です。例文: " + word.example,
                  relatedId: word.id
                };
              }

              const existingQuizIds = new Set(window.ENGLISH_STEP_DATA.quizQuestions.map((question) => question.id));
              window.ENGLISH_STEP_DATA.quizQuestions.push(
                ...window.ENGLISH_STEP_DATA.words
                  .map(buildGeneratedWordQuiz)
                  .filter((question) => !existingQuizIds.has(question.id))
              );
            })();
          ` + "\n</scr" + "ipt>";

        const uiPatch = `
          <style>
            .tool-layout > .tool-panel { position: static; }
            .mini-list {
              display: grid;
              gap: 8px;
              max-height: none;
              overflow: visible;
              padding-right: 0;
            }
            .word-count-note {
              display: block;
              margin-top: 4px;
              color: var(--muted);
              font-size: 0.85rem;
              font-weight: 800;
            }
            .word-list-controls {
              display: grid;
              grid-template-columns: repeat(3, minmax(0, 1fr));
              gap: 8px;
            }
            .word-list-controls button {
              min-height: 40px;
              border: 1px solid var(--line);
              border-radius: var(--radius);
              color: var(--muted);
              font-weight: 800;
              background: #ffffff;
              cursor: pointer;
            }
            .word-list-controls button.active {
              color: #ffffff;
              border-color: var(--teal);
              background: var(--teal);
            }
            .word-list-controls button:disabled {
              cursor: not-allowed;
              opacity: 0.55;
            }
            .word-card-pager { display: none; }
            .word-card-pager span { color: var(--muted); font-weight: 900; text-align: center; }
            @media (max-width: 760px) {
              .word-list-controls { grid-template-columns: 1fr; }
              .word-list-controls button { min-height: 48px; }
              .word-card-pager {
                position: sticky;
                top: 8px;
                z-index: 5;
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
                gap: 8px;
                align-items: center;
                padding: 8px;
                border: 1px solid var(--line);
                border-radius: var(--radius);
                background: rgba(255, 255, 255, 0.96);
                box-shadow: 0 10px 28px rgba(37, 51, 76, 0.12);
              }
              .word-card-pager .secondary-button {
                width: 100%;
                min-height: 46px;
                padding: 10px 12px;
              }
              .word-card + .pager { display: none; }
            }
          </style>
        ` + "<scr" + "ipt>\n" + `
            (() => {
              let fallbackWordListMode = "all";
              let fallbackRandomIndexes = [];

              function syncWordCardPager() {
                const card = document.querySelector(".word-card");
                if (!card) return;
                const hint = card.querySelector(".hint-text");
                const lowerPager = card.nextElementSibling && card.nextElementSibling.classList.contains("pager") ? card.nextElementSibling : null;
                if (!hint || !lowerPager) return;
                const count = lowerPager.querySelector("span")?.textContent?.trim() || "";
                let pager = card.querySelector(".word-card-pager");
                if (!pager) {
                  pager = document.createElement("div");
                  pager.className = "word-card-pager";
                  pager.setAttribute("aria-label", "単語カードの移動");
                  hint.insertAdjacentElement("afterend", pager);
                }
                if (pager.dataset.count === count) return;
                pager.dataset.count = count;
                pager.innerHTML = '<button class="secondary-button" data-action="prev-word">前へ</button><span></span><button class="secondary-button" data-action="next-word">次へ</button>';
                pager.querySelector("span").textContent = count;
              }

              function getFallbackWordButtons(panel) {
                return [...panel.querySelectorAll('.mini-list [data-action="select-word"]')];
              }

              function pickFallbackRandom(count) {
                const indexes = [...Array(count).keys()];
                for (let index = indexes.length - 1; index > 0; index -= 1) {
                  const swapIndex = Math.floor(Math.random() * (index + 1));
                  [indexes[index], indexes[swapIndex]] = [indexes[swapIndex], indexes[index]];
                }
                return indexes.slice(0, Math.min(10, count));
              }

              function applyFallbackWordList(panel) {
                const buttons = getFallbackWordButtons(panel);
                if (!buttons.length) return;
                if (fallbackWordListMode === "random" && fallbackRandomIndexes.length !== buttons.length) {
                  fallbackRandomIndexes = pickFallbackRandom(buttons.length);
                }
                const visibleIndexes = new Set(fallbackWordListMode === "random" ? fallbackRandomIndexes : buttons.map((_, index) => index));
                buttons.forEach((button, index) => {
                  button.hidden = !visibleIndexes.has(index);
                });
                const visibleCount = buttons.filter((button) => !button.hidden).length;
                const heading = panel.querySelector(".section-heading h2");
                if (heading) heading.textContent = visibleCount + "語";
                let note = panel.querySelector(".word-count-note");
                if (!note && heading) {
                  note = document.createElement("small");
                  note.className = "word-count-note";
                  heading.insertAdjacentElement("afterend", note);
                }
                if (note) {
                  note.textContent = fallbackWordListMode === "random"
                    ? "全" + buttons.length + "語からランダム" + visibleCount + "語を表示"
                    : "選択中レベルの全" + buttons.length + "語を表示";
                }
              }

              function syncFallbackWordControls() {
                const panel = document.querySelector(".tool-layout > .tool-panel");
                if (!panel) return;
                if (panel.querySelector(".word-list-controls:not(.fallback-word-list-controls)")) return;
                const segmented = panel.querySelector(".segmented");
                if (!segmented) return;
                let controls = panel.querySelector(".fallback-word-list-controls");
                if (!controls) {
                  controls = document.createElement("div");
                  controls.className = "word-list-controls fallback-word-list-controls";
                  controls.setAttribute("aria-label", "単語の表示方法");
                  controls.innerHTML = '<button data-fallback-word-list-mode="all">全て表示</button><button data-fallback-word-list-mode="random">ランダム10語</button><button data-fallback-word-list-mode="shuffle">ランダム更新</button>';
                  segmented.insertAdjacentElement("beforebegin", controls);
                }
                controls.querySelectorAll("button").forEach((button) => {
                  const mode = button.dataset.fallbackWordListMode;
                  button.classList.toggle("active", mode === fallbackWordListMode || (mode === "shuffle" && fallbackWordListMode === "random"));
                  if (mode === "shuffle") button.disabled = fallbackWordListMode !== "random";
                });
                applyFallbackWordList(panel);
              }

              document.addEventListener("click", (event) => {
                const button = event.target.closest("[data-fallback-word-list-mode]");
                if (!button) return;
                const mode = button.dataset.fallbackWordListMode;
                if (mode === "all") {
                  fallbackWordListMode = "all";
                } else {
                  fallbackWordListMode = "random";
                  fallbackRandomIndexes = [];
                }
                syncFallbackWordControls();
              });

              function syncWordUi() {
                syncWordCardPager();
                syncFallbackWordControls();
              }

              let syncQueued = false;
              function queueWordUiSync() {
                if (syncQueued) return;
                syncQueued = true;
                requestAnimationFrame(() => {
                  syncQueued = false;
                  syncWordUi();
                });
              }

              new MutationObserver(queueWordUiSync).observe(document.body, { childList: true, subtree: true });
              requestAnimationFrame(syncWordUi);
            })();
          ` + "\n</scr" + "ipt>";

        html = html.replace(/<script>\s*\(function \(\)/, dataPatch + "$&");
        html = html.replace("</body>", uiPatch + "</body>");
        document.open();
        document.write(html);
        document.close();
      })().catch((error) => {
        document.body.innerHTML = `<main style="font-family:sans-serif;padding:24px;line-height:1.8"><h1>English Step</h1><p>読み込みに失敗しました。時間をおいて再読み込みしてください。</p><pre style="white-space:pre-wrap;color:#647084">${error.message}</pre></main>`;
      });
    </script>
  </body>
</html>
