<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Step</title>
  </head>
  <body>
    <noscript>English Stepを利用するにはJavaScriptを有効にしてください。</noscript>
    <main id="loading" style="font-family: Segoe UI, Hiragino Sans, Yu Gothic, Meiryo, sans-serif; padding: 24px; line-height: 1.8; color: #172033;">English Stepを読み込んでいます。</main>
    <script>
      (async () => {
        const baseUrl = "https://raw.githubusercontent.com/ny1515/touch-invaders/5aec59b020eb7698f283dbf2e2a1476ecb4d3760/english-step/index.html";
        const source = await fetch(baseUrl, { cache: "no-store" }).then((response) => {
          if (!response.ok) throw new Error(`Base app load failed: ${response.status}`);
          return response.text();
        });
        const match = source.match(/const payload = "([^"]+)"/);
        if (!match) throw new Error("Base app payload not found");
        if (!("DecompressionStream" in window)) {
          document.body.innerHTML = "<main style=\"font-family:sans-serif;padding:24px;line-height:1.8\"><h1>English Step</h1><p>このブラウザは圧縮された公開版の読み込みに対応していません。最新のChrome、Edge、Safariで開いてください。</p></main>";
          return;
        }
        const binary = atob(match[1]);
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        let html = await new Response(stream).text();
        const patch = `
          <style>
            .word-card-pager { display: none; }
            .word-card-pager span { color: var(--muted); font-weight: 900; text-align: center; }
            @media (max-width: 760px) {
              .word-card-pager {
                position: sticky;
                top: 8px;
                z-index: 5;
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
                gap: 8px;
                align-items: center;
                padding: 8px;
                border: 1px solid var(--line);
                border-radius: var(--radius);
                background: rgba(255, 255, 255, 0.96);
                box-shadow: 0 10px 28px rgba(37, 51, 76, 0.12);
              }
              .word-card-pager .secondary-button {
                width: 100%;
                min-height: 46px;
                padding: 10px 12px;
              }
              .word-card + .pager { display: none; }
            }
          </style>
          <script>
            (() => {
              function syncWordCardPager() {
                const card = document.querySelector(".word-card");
                if (!card) return;
                const hint = card.querySelector(".hint-text");
                const lowerPager = card.nextElementSibling && card.nextElementSibling.classList.contains("pager") ? card.nextElementSibling : null;
                if (!hint || !lowerPager) return;
                const count = lowerPager.querySelector("span")?.textContent?.trim() || "";
                let pager = card.querySelector(".word-card-pager");
                if (!pager) {
                  pager = document.createElement("div");
                  pager.className = "word-card-pager";
                  pager.setAttribute("aria-label", "単語カードの移動");
                  hint.insertAdjacentElement("afterend", pager);
                }
                if (pager.dataset.count === count) return;
                pager.dataset.count = count;
                pager.innerHTML = '<button class="secondary-button" data-action="prev-word">前へ</button><span></span><button class="secondary-button" data-action="next-word">次へ</button>';
                pager.querySelector("span").textContent = count;
              }
              new MutationObserver(syncWordCardPager).observe(document.body, { childList: true, subtree: true });
              requestAnimationFrame(syncWordCardPager);
            })();
          <\/script>`;
        html = html.replace("</body>", `${patch}</body>`);
        document.open();
        document.write(html);
        document.close();
      })().catch((error) => {
        document.body.innerHTML = `<main style="font-family:sans-serif;padding:24px;line-height:1.8"><h1>English Step</h1><p>読み込みに失敗しました。時間をおいて再読み込みしてください。</p><pre style="white-space:pre-wrap;color:#647084">${error.message}</pre></main>`;
      });
    </script>
  </body>
</html>
