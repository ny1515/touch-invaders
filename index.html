<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07070a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Touch Invaders">
  <title>Touch Invaders</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <style>
    :root { color-scheme: dark; --bg:#07070a; --panel:#11131b; --line:rgba(247,244,232,.16); --text:#f7f4e8; --muted:#aaa6a0; --cyan:#35f4d0; --pink:#ff4b70; --amber:#ffd166; --green:#8cff7a; }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body { margin:0; overflow:hidden; background:var(--bg); color:var(--text); font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overscroll-behavior:none; touch-action:none; user-select:none; }
    button { border:0; color:inherit; font:inherit; -webkit-tap-highlight-color:transparent; }
    .shell { display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100dvh; min-height:420px; background:#07070a; }
    .hud { display:grid; grid-template-columns:minmax(108px,.9fr) minmax(188px,1.4fr) 44px; align-items:center; gap:10px; min-height:58px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; border-bottom:1px solid var(--line); background:rgba(7,7,10,.94); }
    .brand { display:flex; align-items:center; min-width:0; gap:8px; color:var(--cyan); font-size:12px; font-weight:900; white-space:nowrap; }
    .mark { width:18px; height:14px; flex:0 0 auto; background:linear-gradient(var(--cyan),var(--cyan)) 4px 0/10px 4px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 0 4px/18px 6px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 3px 10px/4px 4px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 11px 10px/4px 4px no-repeat; filter:drop-shadow(0 0 8px rgba(53,244,208,.45)); }
    .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; color:var(--muted); font-size:11px; white-space:nowrap; }
    .stats strong { display:inline-block; min-width:3ch; color:var(--text); font-size:15px; font-variant-numeric:tabular-nums; }
    .icon { display:grid; width:42px; height:42px; place-items:center; border:1px solid var(--line); border-radius:8px; background:#191b23; font-weight:900; cursor:pointer; }
    .stage { position:relative; min-height:0; overflow:hidden; }
    canvas { display:block; width:100%; height:100%; cursor:crosshair; touch-action:none; }
    .scan { position:absolute; inset:0; pointer-events:none; opacity:.18; background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(247,244,232,.12) 4px); mix-blend-mode:screen; }
    .overlay { position:absolute; inset:0; display:grid; place-items:center; padding:20px; background:rgba(7,7,10,.42); }
    .overlay[hidden] { display:none; }
    .panel { width:min(330px,100%); padding:22px; border:1px solid rgba(247,244,232,.22); border-radius:8px; background:rgba(12,13,18,.9); box-shadow:0 22px 80px rgba(0,0,0,.42); text-align:center; }
    .panel p { margin:12px 0 18px; color:var(--muted); font-size:14px; line-height:1.5; }
    .panel h1 { margin:0; font-size:32px; line-height:1; }
    .kicker { margin:0 0 8px !important; color:var(--amber) !important; font-size:12px !important; font-weight:900; }
    .primary { min-width:150px; height:48px; padding:0 24px; border-radius:8px; background:var(--text); color:#07070a; font-weight:900; cursor:pointer; }
    .controls { display:grid; grid-template-columns:1fr 1.14fr 1fr; gap:12px; width:min(100%,620px); justify-self:center; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:rgba(7,7,10,.96); }
    .control { display:grid; min-height:68px; place-items:center; border:1px solid rgba(247,244,232,.18); border-radius:8px; background:#191b23; color:var(--cyan); cursor:pointer; touch-action:none; }
    .control:active,.control.active,.icon:active { transform:translateY(1px); }
    .control svg { width:32px; height:32px; filter:drop-shadow(0 0 10px rgba(53,244,208,.36)); }
    .fire { color:var(--pink); background:#22151b; }
    .fire svg { width:35px; height:35px; filter:drop-shadow(0 0 12px rgba(255,75,112,.42)); }
    @media (min-width:760px){ .shell{ width:min(760px,100vw); margin:0 auto; border-inline:1px solid var(--line); } }
    @media (max-height:560px) and (orientation:landscape){ .hud{ min-height:48px; padding-top:calc(6px + env(safe-area-inset-top)); padding-bottom:6px; } .controls{ padding-top:8px; padding-bottom:calc(8px + env(safe-area-inset-bottom)); } .control{ min-height:54px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hud">
      <div class="brand"><span class="mark" aria-hidden="true"></span><span>TOUCH INVADERS</span></div>
      <div class="stats"><span>Score <strong id="score">0</strong></span><span>Best <strong id="best">0</strong></span><span>Lives <strong id="lives">3</strong></span></div>
      <button class="icon" id="pause" type="button" aria-label="Pause"><span>II</span></button>
    </header>
    <section class="stage">
      <canvas id="game" aria-label="Touch Invaders game"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div class="overlay" id="overlay"><div class="panel"><p class="kicker">LEVEL <span id="level">1</span></p><h1 id="title">Touch Invaders</h1><p id="message">Defend the line. Drag to move, tap to shoot.</p><button class="primary" id="start" type="button">START</button></div></div>
    </section>
    <footer class="controls">
      <button class="control" id="left" type="button" aria-label="Move left"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M20.5 6 10.5 16l10 10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="control fire" id="fire" type="button" aria-label="Fire"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5 20.5 14H26L13 29l2.5-11H7z" fill="currentColor"/></svg></button>
      <button class="control" id="right" type="button" aria-label="Move right"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11.5 6 21.5 16l-10 10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </footer>
  </main>
  <script>
    (()=>{
      "use strict";
      const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),overlay=document.getElementById("overlay"),title=document.getElementById("title"),message=document.getElementById("message"),start=document.getElementById("start"),pause=document.getElementById("pause"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),livesEl=document.getElementById("lives"),levelEl=document.getElementById("level");
      const dims={w:0,h:0,dpr:1},input={left:false,right:false,fire:false,target:null,pointer:null,downX:0,downY:0,moved:false,downAt:0};
      const state={status:"ready",score:0,best:Number(localStorage.getItem("touchInvadersBest")||0),lives:3,level:1,t:0,shake:0,enemyClock:.8,clearClock:0};
      const player={x:0,y:0,w:46,h:28,speed:430,cool:0,inv:0};
      const form={dir:1,speed:30,drop:18,total:0};
      let invaders=[],shots=[],enemyShots=[],shields=[],bits=[],stars=[],last=performance.now();
      const sprites=[["00111100","01111110","11011011","11111111","00100100","01000010"],["00100100","01111110","11111111","10111101","10100101","00100100"],["00011000","00111100","01111110","11011011","11111111","01011010"]],colors=["#ff4b70","#ffd166","#8cff7a","#35f4d0","#b78cff"];
      function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
      function hitRectCircle(r,c){const x=clamp(c.x,r.x,r.x+r.w),y=clamp(c.y,r.y,r.y+r.h),dx=c.x-x,dy=c.y-y;return dx*dx+dy*dy<=c.r*c.r;}
      function resize(){const r=canvas.getBoundingClientRect();dims.w=Math.max(1,Math.floor(r.width));dims.h=Math.max(1,Math.floor(r.height));dims.dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(dims.w*dims.dpr);canvas.height=Math.floor(dims.h*dims.dpr);ctx.setTransform(dims.dpr,0,0,dims.dpr,0,0);player.x=player.x||dims.w/2;player.y=Math.max(72,dims.h-56);player.x=clamp(player.x,30,dims.w-30);seedStars();}
      function seedStars(){const n=Math.max(54,Math.min(118,Math.floor(dims.w*dims.h/5600)));while(stars.length<n)stars.push({x:Math.random()*dims.w,y:Math.random()*dims.h,s:Math.random()>.82?2:1,v:18+Math.random()*58,a:.25+Math.random()*.7});stars=stars.slice(0,n);}
      function hud(){scoreEl.textContent=state.score;bestEl.textContent=state.best;livesEl.textContent=state.lives;levelEl.textContent=state.level;pause.disabled=state.status==="ready"||state.status==="gameover";pause.firstElementChild.textContent=state.status==="paused"?">":"II";}
      function addScore(n){state.score+=n;if(state.score>state.best){state.best=state.score;localStorage.setItem("touchInvadersBest",state.best);}hud();}
      function panel(a,b,c="START",show=true){title.textContent=a;message.textContent=b;start.textContent=c;start.hidden=!show;overlay.hidden=false;}
      function resetPlayer(){player.x=dims.w/2;player.y=Math.max(72,dims.h-56);player.cool=0;player.inv=1.5;input.target=null;}
      function newGame(){state.status="playing";state.score=0;state.lives=3;state.level=1;state.t=0;state.enemyClock=.75;shots=[];enemyShots=[];bits=[];resetPlayer();spawn();hud();overlay.hidden=true;}
      function spawn(){invaders=[];const cols=dims.w<370?7:dims.w<560?8:10,rows=Math.min(6,4+Math.floor((state.level+1)/3)),sx=Math.min(48,Math.max(36,(dims.w-56)/cols)),sy=dims.h<500?31:38,w=Math.min(30,sx*.68),h=Math.min(24,sy*.62),x0=(dims.w-(cols-1)*sx)/2,y0=dims.h<500?38:54;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)invaders.push({x:x0+c*sx,y:y0+r*sy,w,h,row:r,col:c,type:r%sprites.length,alive:true,phase:Math.random()*6.28});form.dir=1;form.speed=24+state.level*5.4;form.drop=dims.h<500?13:18;form.total=invaders.length;makeShields();}
      function makeShields(){shields=[];if(dims.h<390)return;const count=dims.w<390?3:4,cell=dims.w<390?5:6,pat=["001111100","011111110","111111111","111000111","110000011"],sw=pat[0].length*cell,gap=Math.max(18,(dims.w-count*sw)/(count+1)),y=clamp(player.y-124,Math.max(198,dims.h*.55),player.y-70);for(let s=0;s<count;s++){const x0=gap+s*(sw+gap);for(let r=0;r<pat.length;r++)for(let c=0;c<pat[r].length;c++)if(pat[r][c]==="1")shields.push({x:x0+c*cell,y:y+r*cell,w:cell-1,h:cell-1,hp:2});}}
      function shoot(force=false){if(state.status!=="playing")return;if(player.cool>0&&!force)return;if(force&&player.cool>.08)return;shots.push({x:player.x,y:player.y-player.h*.72,vy:-610,r:3,alive:true});player.cool=.22;}
      function enemyShoot(){if(enemyShots.length>=Math.min(5,1+Math.floor(state.level/2)))return;const front=new Map();for(const e of invaders)if(e.alive){const f=front.get(e.col);if(!f||e.y>f.y)front.set(e.col,e);}const list=[...front.values()];if(!list.length)return;const e=list[Math.floor(Math.random()*list.length)];enemyShots.push({x:e.x,y:e.y+e.h*.55,vy:205+state.level*18,r:4,alive:true});}
      function sparkle(x,y,color,n=8){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=44+Math.random()*170;bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.34+Math.random()*.36,max:.7,size:1.5+Math.random()*3,color});}}
      function shieldHit(b){for(const s of shields)if(s.hp>0&&hitRectCircle(s,b)){s.hp--;sparkle(b.x,b.y,s.hp?"#ffd166":"#f7f4e8",5);return true;}return false;}
      function lose(){if(player.inv>0||state.status!=="playing")return;state.lives--;state.shake=.34;sparkle(player.x,player.y,"#ff4b70",30);if(state.lives<=0){state.status="gameover";panel("GAME OVER","SCORE "+state.score,"RETRY");hud();return;}resetPlayer();shots=[];enemyShots=[];spawn();hud();}
      function levelUp(){state.level++;state.clearClock=1;state.status="clear";shots=[];enemyShots=[];panel("LEVEL "+state.level,"Next wave incoming.","",false);hud();}
      function update(dt){state.t+=dt;for(const s of stars){s.y+=s.v*dt;if(s.y>dims.h+4){s.y=-4;s.x=Math.random()*dims.w;}}for(const b of bits){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=90*dt;b.life-=dt;}bits=bits.filter(b=>b.life>0);state.shake=Math.max(0,state.shake-dt);if(state.status==="clear"){state.clearClock-=dt;if(state.clearClock<=0){spawn();resetPlayer();state.status="playing";overlay.hidden=true;hud();}return;}if(state.status!=="playing")return;player.inv=Math.max(0,player.inv-dt);player.cool=Math.max(0,player.cool-dt);const m=(input.right?1:0)-(input.left?1:0);if(m){player.x+=m*player.speed*dt;input.target=null;}else if(input.target!==null){const d=input.target-player.x;player.x+=Math.sign(d)*Math.min(Math.abs(d),player.speed*1.28*dt);}player.x=clamp(player.x,28,dims.w-28);if(input.fire)shoot();for(const b of shots){b.y+=b.vy*dt;if(b.y<-12)b.alive=false;}for(const b of enemyShots){b.y+=b.vy*dt;if(b.y>dims.h+14)b.alive=false;}const alive=invaders.filter(e=>e.alive);if(!alive.length){levelUp();return;}const speed=form.speed+(form.total-alive.length)*1.55;let min=1e9,max=-1e9,low=-1e9;for(const e of alive){e.x+=form.dir*speed*dt;min=Math.min(min,e.x-e.w/2);max=Math.max(max,e.x+e.w/2);low=Math.max(low,e.y+e.h/2);}if(min<16||max>dims.w-16){form.dir*=-1;for(const e of alive){e.x=clamp(e.x,20+e.w/2,dims.w-20-e.w/2);e.y+=form.drop;}state.shake=Math.max(state.shake,.08);}if(low>player.y-18)lose();collide();state.enemyClock-=dt;if(state.enemyClock<=0){enemyShoot();state.enemyClock=Math.max(.36,1.18-state.level*.055+Math.random()*.72);}}
      function collide(){for(const b of shots){if(!b.alive)continue;if(shieldHit(b)){b.alive=false;continue;}for(const e of invaders)if(e.alive&&hitRectCircle({x:e.x-e.w/2,y:e.y-e.h/2,w:e.w,h:e.h},b)){b.alive=false;e.alive=false;addScore((e.row+1)*10);sparkle(e.x,e.y,colors[e.row%colors.length],14);break;}}const pr={x:player.x-player.w/2,y:player.y-player.h/2,w:player.w,h:player.h};for(const b of enemyShots){if(!b.alive)continue;if(shieldHit(b)){b.alive=false;continue;}if(player.inv<=0&&hitRectCircle(pr,b)){b.alive=false;lose();}}for(const a of shots)for(const b of enemyShots){const dx=a.x-b.x,dy=a.y-b.y,r=a.r+b.r;if(a.alive&&b.alive&&dx*dx+dy*dy<=r*r){a.alive=false;b.alive=false;addScore(2);sparkle(a.x,a.y,"#f7f4e8",5);}}shots=shots.filter(b=>b.alive);enemyShots=enemyShots.filter(b=>b.alive);}
      function drawSprite(lines,x,y,w,h,color){const cw=w/lines[0].length,ch=h/lines.length,x0=x-w/2,y0=y-h/2;ctx.save();ctx.shadowBlur=10;ctx.shadowColor=color;ctx.fillStyle=color;for(let r=0;r<lines.length;r++)for(let c=0;c<lines[r].length;c++)if(lines[r][c]==="1")ctx.fillRect(x0+c*cw,y0+r*ch,Math.ceil(cw),Math.ceil(ch));ctx.restore();}
      function draw(){ctx.save();ctx.clearRect(0,0,dims.w,dims.h);if(state.shake>0){const s=state.shake*8;ctx.translate((Math.random()-.5)*s,(Math.random()-.5)*s);}ctx.fillStyle="#07070a";ctx.fillRect(0,0,dims.w,dims.h);for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle=s.s>1?"#ffd166":"#f7f4e8";ctx.fillRect(s.x|0,s.y|0,s.s,s.s);}ctx.globalAlpha=1;ctx.strokeStyle="rgba(53,244,208,.11)";ctx.lineWidth=1;for(let y=dims.h-(state.t*28%42);y>0;y-=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(dims.w,y);ctx.stroke();}for(const s of shields)if(s.hp>0){ctx.globalAlpha=s.hp>1?.9:.72;ctx.fillStyle=s.hp>1?"#35f4d0":"#ffd166";ctx.fillRect(s.x,s.y,s.w,s.h);}ctx.globalAlpha=1;for(const e of invaders)if(e.alive)drawSprite(sprites[e.type],e.x,e.y,e.w,e.h,colors[e.row%colors.length]);ctx.lineCap="round";for(const b of shots){ctx.strokeStyle="#35f4d0";ctx.shadowColor="#35f4d0";ctx.shadowBlur=10;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(b.x,b.y+9);ctx.lineTo(b.x,b.y-9);ctx.stroke();}for(const b of enemyShots){ctx.strokeStyle="#ff4b70";ctx.shadowColor="#ff4b70";ctx.shadowBlur=10;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(b.x,b.y-7);ctx.lineTo(b.x,b.y+7);ctx.stroke();}ctx.shadowBlur=0;if(!(player.inv>0&&Math.floor(state.t*16)%2===0)){ctx.save();ctx.translate(player.x,player.y);ctx.shadowBlur=16;ctx.shadowColor="#35f4d0";ctx.fillStyle="#35f4d0";ctx.beginPath();ctx.moveTo(0,-player.h/2);ctx.lineTo(player.w/2,player.h/2-2);ctx.lineTo(12,player.h/2);ctx.lineTo(5,4);ctx.lineTo(-5,4);ctx.lineTo(-12,player.h/2);ctx.lineTo(-player.w/2,player.h/2-2);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#f7f4e8";ctx.fillRect(-5,-5,10,8);ctx.fillStyle="#ff4b70";ctx.beginPath();ctx.moveTo(-8,player.h/2-1);ctx.lineTo(0,player.h/2+8+Math.sin(state.t*34)*3);ctx.lineTo(8,player.h/2-1);ctx.closePath();ctx.fill();ctx.restore();}for(const p of bits){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}ctx.globalAlpha=1;ctx.strokeStyle="rgba(255,75,112,.18)";ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(0,player.y-22);ctx.lineTo(dims.w,player.y-22);ctx.stroke();ctx.setLineDash([]);ctx.restore();}
      function loop(now){const dt=Math.min(.033,Math.max(0,(now-last)/1000));last=now;update(dt);draw();requestAnimationFrame(loop);}
      function hold(btn,key){const set=(on,e)=>{e.preventDefault();input[key]=on;btn.classList.toggle("active",on);if(on&&btn.setPointerCapture)btn.setPointerCapture(e.pointerId);if(key==="fire"&&on)shoot(true);};btn.addEventListener("pointerdown",e=>set(true,e));btn.addEventListener("pointerup",e=>set(false,e));btn.addEventListener("pointercancel",e=>set(false,e));btn.addEventListener("lostpointercapture",e=>set(false,e));}
      function point(e){const r=canvas.getBoundingClientRect();return{x:clamp(e.clientX-r.left,24,dims.w-24),y:clamp(e.clientY-r.top,0,dims.h)};}
      hold(document.getElementById("left"),"left");hold(document.getElementById("right"),"right");hold(document.getElementById("fire"),"fire");canvas.addEventListener("pointerdown",e=>{e.preventDefault();if(state.status==="ready"||state.status==="gameover"){newGame();return;}if(state.status==="paused"){state.status="playing";overlay.hidden=true;hud();return;}const p=point(e);input.pointer=e.pointerId;input.target=p.x;input.downX=p.x;input.downY=p.y;input.moved=false;input.downAt=performance.now();if(canvas.setPointerCapture)canvas.setPointerCapture(e.pointerId);});canvas.addEventListener("pointermove",e=>{if(e.pointerId!==input.pointer)return;e.preventDefault();const p=point(e);input.target=p.x;input.moved=input.moved||Math.hypot(p.x-input.downX,p.y-input.downY)>10;});function up(e){if(e.pointerId!==input.pointer)return;e.preventDefault();if(!input.moved&&performance.now()-input.downAt<260)shoot(true);input.pointer=null;input.target=null;}canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);
      addEventListener("keydown",e=>{if(e.code==="ArrowLeft"||e.code==="KeyA"){input.left=true;e.preventDefault();}else if(e.code==="ArrowRight"||e.code==="KeyD"){input.right=true;e.preventDefault();}else if(e.code==="Space"){input.fire=true;shoot(true);e.preventDefault();}else if(e.code==="Enter"&&(state.status==="ready"||state.status==="gameover"))newGame();else if(e.code==="KeyP"||e.code==="Escape")togglePause();});addEventListener("keyup",e=>{if(e.code==="ArrowLeft"||e.code==="KeyA")input.left=false;else if(e.code==="ArrowRight"||e.code==="KeyD")input.right=false;else if(e.code==="Space")input.fire=false;});
      function togglePause(){if(state.status==="playing"){state.status="paused";panel("PAUSE","Defensive line holding.","RESUME");hud();}else if(state.status==="paused"){state.status="playing";overlay.hidden=true;hud();}}
      start.addEventListener("click",()=>state.status==="paused"?togglePause():newGame());pause.addEventListener("click",togglePause);addEventListener("blur",()=>{input.left=input.right=input.fire=false;if(state.status==="playing")togglePause();});
      if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
      resize();addEventListener("resize",resize);hud();requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
